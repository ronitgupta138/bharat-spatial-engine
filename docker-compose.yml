services:
  bharat-spatial-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bharat-spatial-engine
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseZGC -XX:+ZGenerational
      - SPRING_THREADS_VIRTUAL_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
